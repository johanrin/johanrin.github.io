{{- if .Title }}
<figure>
    <img class="zoomable" loading="lazy" decoding="async"
        src="{{ .Destination | safeURL }}" alt="{{ .Text }}" />
    <figcaption>{{ .Title }}</figcaption>
</figure>
{{- else }}
<img class="zoomable" loading="lazy" decoding="async"
    src="{{ .Destination | safeURL }}" alt="{{ .Text }}" />
{{- end }}
